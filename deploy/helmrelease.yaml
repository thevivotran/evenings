apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: evenings
  namespace: evenings
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate # SQLite on an RWO volume: never two pods at once
        pod:
          nodeSelector:
            kubernetes.io/hostname: carange
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          main:
            image:
              repository: ghcr.io/thevivotran/evenings
              tag: main-20261110-000000-0000000 # {"$imagepolicy": "flux-system:evenings:tag"}
            env:
              TZ: Asia/Ho_Chi_Minh
              DB_PATH: /data/evenings.db
              VAPID_CONTACT: mailto:thevivotran@gmail.com
            envFrom:
              - secretRef:
                  name: evenings-secrets # HOST_PIN, WIFE_PIN (sops-encrypted)
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 160Mi
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: tailscale
        hosts:
          - host: evenings
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - evenings
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: evenings-db
        globalMounts:
          - path: /data
